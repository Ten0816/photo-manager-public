<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Manager</title>

    <link rel="stylesheet" href="./css/main.css">

</head>

<body>

    <header class="app-header">

        <div class="header-inner">

            <div class="app-title">
                <div class="app-logo">
                    ◉
                </div>

                <h1>
                    Photo Manager
                </h1>
            </div>


            <div class="header-actions">

                <div id="storage-info">

                    <div id="storage-text">
                        ストレージを取得中...
                    </div>

                    <div id="storage-bar">
                        <div id="storage-bar-fill"></div>
                    </div>

                </div>


                <button id="theme-toggle-button" class="secondary-button">
                    <span id="theme-toggle-icon">☾</span>
                    <span id="theme-toggle-text">ナイトモード</span>
                </button>

                <button id="trash-button" class="secondary-button">
                    <span>🗑</span>
                    <span>ゴミ箱</span>
                </button>

            </div>

        </div>

    </header>


    <main>

        <!-- ================================
         通常画面
    ================================= -->

        <section id="normal-view">


            <!-- フォルダ・パンくず -->

            <section id="folder-section">

                <div id="breadcrumb" class="breadcrumb"></div>


                <div class="folder-toolbar">

                    <button id="parent-folder-button" class="secondary-button">
                        ← 1つ上へ
                    </button>


                    <button id="create-folder-button" class="primary-button">
                        ＋ 新しいフォルダ
                    </button>

                </div>


                <div id="folder-list"></div>

            </section>


            <!-- アップロード -->

            <section id="upload-section">

                <div class="upload-area">

                    <div class="upload-icon">
                        ↑
                    </div>

                    <div class="upload-content">

                        <strong>
                            写真・動画を追加
                        </strong>

                        <span>
                            ここにファイルを選択してください
                        </span>

                    </div>


                    <input type="file" id="file-input" accept="image/*,video/*" multiple>


                    <button id="upload-button" class="primary-button">
                        アップロード
                    </button>

                </div>


                <div id="upload-status"></div>

            </section>


            <!-- メディア一覧 -->

            <section class="media-section">
                <div class="section-header">
                    <h2>メディア</h2>

                    <div class="media-header-actions">
                        <select id="media-sort" aria-label="メディアの並び順">
                            <option value="date-desc">
                                撮影日時が新しい順
                            </option>

                            <option value="date-asc">
                                撮影日時が古い順
                            </option>

                            <option value="name-asc">
                                名前順
                            </option>

                            <option value="name-desc">
                                名前逆順
                            </option>

                            <option value="size-desc">
                                サイズが大きい順
                            </option>

                            <option value="size-asc">
                                サイズが小さい順
                            </option>
                        </select>

                        <button id="media-selection-button" class="secondary-button">
                            ☑ 選択
                        </button>
                    </div>
                </div>

                <div id="media-selection-toolbar" class="media-selection-toolbar" hidden>
                    <div class="selection-info">
                        選択中:
                        <strong id="selected-media-count">0</strong>件
                    </div>

                    <div class="media-selection-actions">
                        <button id="select-all-media-button" class="secondary-button">
                            すべて選択
                        </button>

                        <button id="clear-media-selection-button" class="secondary-button">
                            選択解除
                        </button>

                        <button id="bulk-move-media-button" class="secondary-button">
                            📁 移動
                        </button>

                        <button id="bulk-download-media-button" class="secondary-button">
                            ↓ ダウンロード
                        </button>

                        <button id="bulk-delete-media-button" class="danger-button">
                            🗑 削除
                        </button>
                    </div>
                </div>

                <div id="media-list"></div>
            </section>


        </section>


        <!-- ================================
         ゴミ箱
    ================================= -->

        <section id="trash-view">

            <div id="trash-header">

                <button id="back-from-trash-button" class="secondary-button">
                    ← 戻る
                </button>


                <div class="trash-title">

                    <h2>
                        ゴミ箱
                    </h2>

                    <span>
                        削除したファイル
                    </span>

                </div>


                <button id="empty-trash-button">
                    ゴミ箱を空にする
                </button>

            </div>


            <div id="trash-list"></div>

        </section>

    </main>


    <!-- ================================
     メディアビューア
================================= -->

    <div id="media-modal" class="modal">

        <button id="modal-close" class="modal-close">
            ×
        </button>


        <div id="modal-content"></div>

    </div>


    <script type="module" src="js/main.js"></script>

</body>

</html>
