<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Manager</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/viewer.css">
</head>

<body>
    <header>
        <h1>Photo Manager</h1>

        <div id="storage-info">
            <div id="storage-text">
                ストレージを取得中...
            </div>

            <div id="storage-bar">
                <div id="storage-bar-fill"></div>
            </div>
        </div>

        <button id="trash-button">
            🗑 ゴミ箱
        </button>
    </header>

    <main>

        <!-- 通常画面 -->
        <section id="normal-view">

            <section id="folder-section">
                <div id="breadcrumb"></div>

                <button id="parent-folder-button">
                    1つ上へ
                </button>

                <button id="create-folder-button">
                    新しいフォルダ
                </button>

                <div id="folder-list"></div>
            </section>

            <section id="upload-section">
                <input
                    type="file"
                    id="file-input"
                    accept="image/*,video/*"
                    multiple
                >

                <button id="upload-button">
                    アップロード
                </button>

                <div id="upload-status"></div>
            </section>

            <div id="media-list"></div>

        </section>

        <!-- ゴミ箱画面 -->
        <section id="trash-view">

            <div id="trash-header">
                <button id="back-from-trash-button">
                    ← 戻る
                </button>

                <h2>ゴミ箱</h2>

                <button id="empty-trash-button">
                    ゴミ箱を空にする
                </button>
            </div>

            <div id="trash-list"></div>

        </section>

    </main>

    <div id="media-modal" class="modal">
        <button id="modal-close" class="modal-close">
            ×
        </button>

        <div id="modal-content"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
