<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ログイン - Photo Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f5;
        }

        .login-container {
            width: min(
                90%,
                400px
            );

            padding: 32px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;

            text-align: center;

            font-size: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #666;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #333;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .error-message {
            display: none;

            margin-bottom: 16px;
            padding: 10px;

            border-radius: 6px;

            background: #ffe5e5;
            color: #c00;

            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <h1>
            Photo Manager
        </h1>

        <div
            id="error-message"
            class="error-message"
        ></div>

        <form id="login-form">

            <div class="form-group">

                <label for="username">
                    ユーザー名
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    パスワード
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                id="login-button"
                type="submit"
            >
                ログイン
            </button>

        </form>

    </main>

    <script>
        const form =
            document.getElementById(
                "login-form"
            );

        const usernameInput =
            document.getElementById(
                "username"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const loginButton =
            document.getElementById(
                "login-button"
            );

        const errorMessage =
            document.getElementById(
                "error-message"
            );

        form.addEventListener(
            "submit",
            async event => {
                event.preventDefault();

                errorMessage.style.display =
                    "none";

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "ログイン中...";

                try {
                    const response =
                        await fetch(
                            "/api/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    username:
                                        usernameInput.value,

                                    password:
                                        passwordInput.value
                                })
                            }
                        );

                    const data =
                        await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.error ||
                            "ログインに失敗しました。"
                        );
                    }

                    window.location.href =
                        "/";

                } catch (error) {
                    errorMessage.textContent =
                        error.message;

                    errorMessage.style.display =
                        "block";

                    passwordInput.value = "";

                    passwordInput.focus();

                } finally {
                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "ログイン";
                }
            }
        );
    </script>

</body>

</html>
