services:
  photo-manager:
    build: .
    container_name: photo-manager
    user: "1000:1003"

    environment:
      PORT: 3000
      MEDIA_DIR: /data/Memory
      DATABASE_PATH: /app/data/photo-manager.db

    volumes:
      - /mnt/photo-hdd/Memory:/data/Memory
      - ./data:/app/data

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: photo-manager-nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - photo-manager

    restart: unless-stopped
