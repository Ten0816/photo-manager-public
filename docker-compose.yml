services:
  photo-manager:
    build: .
    container_name: photo-manager
    user: "1000:1003"

    env_file:
      - .env

    environment:
      PORT: 3000
      MEDIA_DIR: /data/Memory
      DATABASE_PATH: /app/data/photo-manager.db

    volumes:
      - /mnt/photo-hdd/Memory:/data/Memory
      - ./data:/app/data

    restart: unless-stopped

  photo-manager-scan:
    build: .
    container_name: photo-manager-scan
    user: "1000:1003"

    environment:
      MEDIA_DIR: /data/Memory
      DATABASE_PATH: /app/data/photo-manager.db

    volumes:
      - /mnt/photo-hdd/Memory:/data/Memory
      - ./data:/app/data

    command:
      - /bin/sh
      - -c
      - |
        sleep 60
        while true; do
          if node scan-media.js; then
            node cleanup-trash.js
          else
            echo "Scan failed: skipping trash cleanup" >&2
          fi
          sleep 300
        done

    restart: unless-stopped

  # Automatic consistent SQLite snapshots (on the SD card by default).
  # Copy backups to a second device as protection against SD-card failure.
  photo-manager-backup:
    build: .
    container_name: photo-manager-backup
    user: "1000:1003"
    environment:
      DATABASE_PATH: /app/data/photo-manager.db
      BACKUP_DIR: /app/data/backups
    volumes:
      - ./data:/app/data
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          node backup-database.js
          sleep 86400
        done
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: photo-manager-nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - photo-manager

    restart: unless-stopped